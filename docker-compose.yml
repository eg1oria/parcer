networks:
  app:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testprep}
      POSTGRES_USER: ${POSTGRES_USER:-testprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: nataliagorlach-backend:latest
    build:
      context: ./backend
      provenance: false
    volumes:
      - imported_test_images:/app/.tmp/imported-tests
    expose:
      - '5000'
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-testprep}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testprep}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      RAW_IMPORT_MAX_CHARS: ${RAW_IMPORT_MAX_CHARS:-100000}
      MAX_UPLOAD_FILE_SIZE_BYTES: ${MAX_UPLOAD_FILE_SIZE_BYTES:-10485760}
      MAX_REQUEST_BODY_SIZE_BYTES: ${MAX_REQUEST_BODY_SIZE_BYTES:-20971520}
      PDF_IMAGE_EXTRACTION_TIMEOUT_MS: ${PDF_IMAGE_EXTRACTION_TIMEOUT_MS:-15000}
      PDF_TEXT_EXTRACTION_TIMEOUT_MS: ${PDF_TEXT_EXTRACTION_TIMEOUT_MS:-30000}
      PDF_RICH_EXTRACTION_ENABLED: ${PDF_RICH_EXTRACTION_ENABLED:-true}
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: nataliagorlach-frontend:latest
    build:
      context: ./frontend
      provenance: false
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - '3000'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  imported_test_images:
