services:
  postgres:
    image: postgres:16-alpine
    container_name: testprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testprep
      POSTGRES_USER: testprep
      POSTGRES_PASSWORD: testprep
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
